<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1300 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="docs-seq-title docs-seq-desc">
      <title id="docs-seq-title">Docs Agent's retrieve-translate-search-compose sequence</title>
      <desc id="docs-seq-desc">Sequence diagram showing the Docs A2A server calling run_docs_agent, which reads the knowledge-base retriever unconditionally, asks the chat model to extract and translate a Ukrainian catalogue search term, optionally calls Silpo MCP when a search term was found (skipped otherwise, and degrading to an empty result on most failures except an expired auth token which raises), merges the retrieved text into one prompt block, asks the chat model a second time to compose the final answer, then separately merges the retrieved sources' metadata to overwrite the answer's own claimed source list, and returns the result to the A2A server.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#000000"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FCA600"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="130" y1="80" x2="130" y2="668" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="390" y1="80" x2="390" y2="668" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="650" y1="80" x2="650" y2="668" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="910" y1="80" x2="910" y2="668" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1170" y1="80" x2="1170" y2="668" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- OPT frame: Silpo MCP call -->
      <rect x="374" y="280" width="812" height="92" rx="4" fill="rgba(51,58,5,0.03)" stroke="rgba(51,58,5,0.22)" stroke-width="1"/>
      <rect x="374" y="280" width="36" height="16" rx="2" fill="#f5f5f5" stroke="rgba(51,58,5,0.22)" stroke-width="1"/>
      <text x="392" y="292" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="0.08em">OPT</text>
      <text x="416" y="292" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">[search term is non-empty]</text>

      <!-- Activation bars -->
      <rect x="126" y="112" width="8" height="530" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="386" y="112" width="8" height="530" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="646" y="152" width="8" height="32" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="906" y="216" width="8" height="32" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="906" y="502" width="8" height="32" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1166" y="316" width="8" height="32" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1: A2A Server -> run_docs_agent -->
      <line x1="138" y1="112" x2="382" y2="112" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="170" y="98" width="220" height="14" rx="2" fill="#f5f5f5"/>
      <text x="280" y="108" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">run_docs_agent(masked_query)</text>

      <!-- M2: run_docs_agent -> Retriever -->
      <line x1="398" y1="152" x2="642" y2="152" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="440" y="138" width="160" height="14" rx="2" fill="#f5f5f5"/>
      <text x="520" y="148" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">invoke(masked_query)</text>

      <!-- M3: Retriever --> run_docs_agent -->
      <line x1="650" y1="184" x2="402" y2="184" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="440" y="170" width="170" height="14" rx="2" fill="#f5f5f5"/>
      <text x="525" y="180" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">kb_docs (chunks + metadata)</text>

      <!-- M4: run_docs_agent -> Chat model (translate) -->
      <line x1="398" y1="216" x2="902" y2="216" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="560" y="202" width="180" height="14" rx="2" fill="#f5f5f5"/>
      <text x="650" y="212" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">translate_fn(masked_query)</text>

      <!-- M5: Chat model --> run_docs_agent -->
      <line x1="910" y1="248" x2="402" y2="248" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="560" y="234" width="180" height="14" rx="2" fill="#f5f5f5"/>
      <text x="650" y="244" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">search_term_uk (may be empty)</text>

      <rect x="392" y="264" width="330" height="14" rx="2" fill="#f5f5f5"/>
      <text x="392" y="274" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">span: docs_agent.translate (traced since 2026-08-29)</text>

      <!-- M6: run_docs_agent -> Silpo MCP -->
      <line x1="398" y1="316" x2="1162" y2="316" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="700" y="302" width="220" height="14" rx="2" fill="#f5f5f5"/>
      <text x="810" y="312" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">search_products(search_term_uk)</text>

      <!-- M7: Silpo MCP --> run_docs_agent -->
      <line x1="1170" y1="348" x2="402" y2="348" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="700" y="334" width="220" height="14" rx="2" fill="#f5f5f5"/>
      <text x="810" y="344" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">products (list) | error</text>

      <rect x="392" y="386" width="440" height="14" rx="2" fill="#f5f5f5"/>
      <text x="392" y="396" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">note: auth-expired error raises (loud); any other MCP failure degrades to []</text>

      <!-- Self message: merge 1 of 2 — TEXT content, feeds the prompt -->
      <rect x="392" y="418" width="420" height="14" rx="2" fill="#f5f5f5"/>
      <text x="392" y="428" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">merge 1 of 2 — TEXT content, feeds the prompt (not sources)</text>
      <rect x="392" y="440" width="300" height="14" rx="2" fill="#f5f5f5"/>
      <text x="392" y="450" fill="#000000" font-size="11" font-family="Arial, sans-serif">retrieved_block = kb_texts + mcp_texts</text>
      <path d="M 384,462 H 420 V 478 H 384" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M8: run_docs_agent -> Chat model (compose) -->
      <line x1="398" y1="502" x2="902" y2="502" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="560" y="488" width="180" height="14" rx="2" fill="#f5f5f5"/>
      <text x="650" y="498" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">compose_fn(prompt)</text>

      <!-- M9: Chat model --> run_docs_agent -->
      <line x1="910" y1="534" x2="402" y2="534" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="560" y="520" width="180" height="14" rx="2" fill="#f5f5f5"/>
      <text x="650" y="530" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">DocsResponse (answer, confidence)</text>

      <!-- Self message: merge 2 of 2 — source METADATA, overwrites the model's own answer.sources -->
      <rect x="392" y="558" width="460" height="14" rx="2" fill="#f5f5f5"/>
      <text x="392" y="568" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">merge 2 of 2 — source METADATA, overwrites answer.sources (not text)</text>
      <rect x="392" y="580" width="280" height="14" rx="2" fill="#f5f5f5"/>
      <text x="392" y="590" fill="#000000" font-size="11" font-family="Arial, sans-serif">sources = kb_sources + mcp_sources</text>
      <path d="M 384,602 H 420 V 618 H 384" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M11: run_docs_agent --> A2A Server (headline return, accent) -->
      <line x1="386" y1="642" x2="142" y2="642" stroke="#FCA600" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="160" y="628" width="256" height="14" rx="2" fill="#f5f5f5"/>
      <text x="288" y="638" fill="#FCA600" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">DocsAgentResult(response, context, tools_called)</text>

      <!-- Actor boxes -->
      <rect x="50" y="40" width="160" height="40" rx="6" fill="rgba(157,177,221,0.30)" stroke="#333A05" stroke-width="1"/>
      <text x="130" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Docs A2A Server</text>
      <text x="130" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">the A2A hop's entry point</text>

      <rect x="310" y="40" width="160" height="40" rx="6" fill="#ffffff" stroke="#333A05" stroke-width="1"/>
      <text x="390" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">run_docs_agent</text>
      <text x="390" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">orchestrator</text>

      <rect x="570" y="40" width="160" height="40" rx="6" fill="rgba(157,177,221,0.30)" stroke="#333A05" stroke-width="1"/>
      <text x="650" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Retriever</text>
      <text x="650" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">hybrid KB search</text>

      <rect x="830" y="40" width="160" height="40" rx="6" fill="rgba(82,124,35,0.10)" stroke="#527C23" stroke-width="1"/>
      <text x="910" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Chat model</text>
      <text x="910" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">openai/gpt-5.6-luna</text>

      <rect x="1090" y="40" width="160" height="40" rx="6" fill="rgba(82,124,35,0.10)" stroke="#527C23" stroke-width="1"/>
      <text x="1170" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Silpo MCP</text>
      <text x="1170" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">retail catalogue, external</text>

      <!-- Legend -->
      <line x1="40" y1="688" x2="1260" y2="688" stroke="rgba(51,58,5,0.14)" stroke-width="0.8"/>
      <line x1="40" y1="708" x2="68" y2="708" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="76" y="712" fill="#333A05" font-size="11" font-family="Arial, sans-serif">Call</text>
      <line x1="140" y1="708" x2="168" y2="708" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="176" y="712" fill="#333A05" font-size="11" font-family="Arial, sans-serif">Return</text>
      <line x1="260" y1="708" x2="288" y2="708" stroke="#FCA600" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <text x="296" y="712" fill="#333A05" font-size="11" font-family="Arial, sans-serif">Result back to A2A server</text>
    </svg>
