<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1300 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ws-seq-title ws-seq-desc">
      <title id="ws-seq-title">Web Search Agent's search-with-fallback-then-compose sequence</title>
      <desc id="ws-seq-desc">Sequence diagram showing the Web Search A2A server calling run_web_search, which tries Tavily first and falls back to ddgs (DuckDuckGo) only if Tavily raises an exception, using whichever provider's results actually came back — never both — then builds one text block from those results, asks the chat model once to compose the final answer, patches only the retrieved_at timestamp on the model's own claimed sources with the real fetch time, and returns the result to the A2A server; if both providers fail, a SearchUnavailableError propagates as the task's own tool-unavailable escalation trigger.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#000000"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FCA600"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="130" y1="80" x2="130" y2="600" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="390" y1="80" x2="390" y2="600" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="650" y1="80" x2="650" y2="600" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="910" y1="80" x2="910" y2="600" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1170" y1="80" x2="1170" y2="600" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ALT frame: Tavily then DuckDuckGo fallback -->
      <rect x="374" y="152" width="552" height="188" rx="4" fill="rgba(51,58,5,0.03)" stroke="rgba(51,58,5,0.22)" stroke-width="1"/>
      <rect x="374" y="152" width="36" height="16" rx="2" fill="#f5f5f5" stroke="rgba(51,58,5,0.22)" stroke-width="1"/>
      <text x="392" y="164" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="0.08em">ALT</text>
      <text x="416" y="164" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">[Tavily succeeds]</text>
      <line x1="382" y1="260" x2="918" y2="260" stroke="rgba(51,58,5,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="392" y="276" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">[else — Tavily raised, try DuckDuckGo]</text>

      <!-- Activation bars -->
      <rect x="126" y="112" width="8" height="466" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="386" y="112" width="8" height="466" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="646" y="196" width="8" height="32" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="906" y="288" width="8" height="32" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1166" y="456" width="8" height="32" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1: A2A Server -> run_web_search -->
      <line x1="138" y1="112" x2="382" y2="112" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="170" y="98" width="230" height="14" rx="2" fill="#f5f5f5"/>
      <text x="285" y="108" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">run_web_search(masked_query)</text>

      <!-- M2: run_web_search -> Tavily -->
      <line x1="398" y1="196" x2="642" y2="196" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="430" y="182" width="200" height="14" rx="2" fill="#f5f5f5"/>
      <text x="530" y="192" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">search(query, max_results=5)</text>

      <!-- M3: Tavily --> run_web_search -->
      <line x1="650" y1="228" x2="402" y2="228" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="440" y="214" width="180" height="14" rx="2" fill="#f5f5f5"/>
      <text x="530" y="224" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">results (≤5) | raises</text>

      <!-- M4: run_web_search -> DuckDuckGo -->
      <line x1="398" y1="288" x2="902" y2="288" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="560" y="274" width="180" height="14" rx="2" fill="#f5f5f5"/>
      <text x="650" y="284" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">text(query, max_results=5)</text>

      <!-- M5: DuckDuckGo --> run_web_search -->
      <line x1="910" y1="320" x2="402" y2="320" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="560" y="306" width="180" height="14" rx="2" fill="#f5f5f5"/>
      <text x="650" y="316" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">results (≤5) | raises</text>

      <rect x="392" y="356" width="480" height="14" rx="2" fill="#f5f5f5"/>
      <text x="392" y="366" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">note: both providers failing → SearchUnavailableError (escalation trigger)</text>

      <!-- Self message: build retrieved_block -->
      <rect x="392" y="390" width="420" height="14" rx="2" fill="#f5f5f5"/>
      <text x="392" y="400" fill="#000000" font-size="11" font-family="Arial, sans-serif">retrieved_block = title + url + content, per result</text>
      <path d="M 384,412 H 420 V 428 H 384" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M6: run_web_search -> Chat model (compose) -->
      <line x1="398" y1="456" x2="1162" y2="456" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="700" y="442" width="180" height="14" rx="2" fill="#f5f5f5"/>
      <text x="790" y="452" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">compose_fn(prompt)</text>

      <!-- M7: Chat model --> run_web_search -->
      <line x1="1170" y1="488" x2="402" y2="488" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="700" y="474" width="200" height="14" rx="2" fill="#f5f5f5"/>
      <text x="800" y="484" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">WebSearchResponse (answer, sources)</text>

      <!-- Self message: patch retrieved_at only -->
      <rect x="392" y="512" width="440" height="14" rx="2" fill="#f5f5f5"/>
      <text x="392" y="522" fill="#000000" font-size="11" font-family="Arial, sans-serif">sources[i].retrieved_at = fetched_at (ref unchanged)</text>
      <path d="M 384,534 H 420 V 550 H 384" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M8: run_web_search --> A2A Server (headline return, accent) -->
      <line x1="386" y1="578" x2="142" y2="578" stroke="#FCA600" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="150" y="564" width="270" height="14" rx="2" fill="#f5f5f5"/>
      <text x="285" y="574" fill="#FCA600" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">WebSearchAgentResult(response, context, tools_called)</text>

      <!-- Actor boxes -->
      <rect x="50" y="40" width="160" height="40" rx="6" fill="rgba(157,177,221,0.30)" stroke="#333A05" stroke-width="1"/>
      <text x="130" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Web Search A2A</text>
      <text x="130" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">the A2A hop's entry point</text>

      <rect x="310" y="40" width="160" height="40" rx="6" fill="#ffffff" stroke="#333A05" stroke-width="1"/>
      <text x="390" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">run_web_search</text>
      <text x="390" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">orchestrator</text>

      <rect x="570" y="40" width="160" height="40" rx="6" fill="rgba(82,124,35,0.10)" stroke="#527C23" stroke-width="1"/>
      <text x="650" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Tavily</text>
      <text x="650" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">primary, paid, keyed</text>

      <rect x="830" y="40" width="160" height="40" rx="6" fill="rgba(82,124,35,0.10)" stroke="#527C23" stroke-width="1"/>
      <text x="910" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">DuckDuckGo</text>
      <text x="910" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">fallback, free, no key (ddgs)</text>

      <rect x="1090" y="40" width="160" height="40" rx="6" fill="rgba(82,124,35,0.10)" stroke="#527C23" stroke-width="1"/>
      <text x="1170" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Chat model</text>
      <text x="1170" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">deepseek/deepseek-v4-flash</text>

      <!-- Legend -->
      <line x1="40" y1="616" x2="1260" y2="616" stroke="rgba(51,58,5,0.14)" stroke-width="0.8"/>
      <line x1="40" y1="636" x2="68" y2="636" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="76" y="640" fill="#333A05" font-size="11" font-family="Arial, sans-serif">Call</text>
      <line x1="140" y1="636" x2="168" y2="636" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="176" y="640" fill="#333A05" font-size="11" font-family="Arial, sans-serif">Return</text>
      <line x1="260" y1="636" x2="288" y2="636" stroke="#FCA600" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <text x="296" y="640" fill="#333A05" font-size="11" font-family="Arial, sans-serif">Result back to A2A server</text>
    </svg>
