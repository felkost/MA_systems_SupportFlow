<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="router-seq-title router-seq-desc">
      <title id="router-seq-title">Router's classification call sequence</title>
      <desc id="router-seq-desc">Sequence diagram showing the Supervisor's router_node calling run_router, which loops calling call_router and the chat model up to max_retries times on timeout or invalid output, then returns either a validated classification or None to signal that decide_route should be skipped and the request should fail closed to Escalation.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#000000"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FCA600"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="140" y1="80" x2="140" y2="560" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="420" y1="80" x2="420" y2="560" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="680" y1="80" x2="680" y2="560" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="940" y1="80" x2="940" y2="560" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Loop fragment frame -->
      <rect x="404" y="152" width="552" height="180" rx="4" fill="rgba(51,58,5,0.03)" stroke="rgba(51,58,5,0.22)" stroke-width="1"/>
      <rect x="404" y="152" width="42" height="16" rx="2" fill="#f5f5f5" stroke="rgba(51,58,5,0.22)" stroke-width="1"/>
      <text x="425" y="164" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
      <text x="454" y="164" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">[attempt ≤ max_retries, stop on success]</text>

      <!-- Activation bars -->
      <rect x="136" y="112" width="8" height="288" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="416" y="112" width="8" height="288" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="676" y="196" width="8" height="120" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="936" y="228" width="8" height="52" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1: Supervisor -> RouterAgent -->
      <line x1="148" y1="112" x2="412" y2="112" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="180" y="98" width="200" height="14" rx="2" fill="#f5f5f5"/>
      <text x="280" y="108" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">run_router(masked_text)</text>

      <!-- M2: RouterAgent -> call_router -->
      <line x1="428" y1="196" x2="672" y2="196" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="470" y="182" width="160" height="14" rx="2" fill="#f5f5f5"/>
      <text x="550" y="192" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">call_router(envelope)</text>

      <!-- M3: call_router -> LLM -->
      <line x1="688" y1="228" x2="932" y2="228" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="740" y="214" width="140" height="14" rx="2" fill="#f5f5f5"/>
      <text x="810" y="224" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">invoke(prompt)</text>

      <!-- M4: LLM --> call_router (dashed return) -->
      <line x1="936" y1="264" x2="692" y2="264" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="722" y="250" width="192" height="14" rx="2" fill="#f5f5f5"/>
      <text x="818" y="260" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">result | timeout | invalid</text>

      <!-- M5: call_router --> RouterAgent (dashed return) -->
      <line x1="676" y1="296" x2="432" y2="296" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="462" y="282" width="224" height="14" rx="2" fill="#f5f5f5"/>
      <text x="574" y="292" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">(classification, version) | raise</text>

      <!-- M6: RouterAgent --> Supervisor (headline return, accent) -->
      <line x1="416" y1="368" x2="152" y2="368" stroke="#FCA600" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="164" y="354" width="248" height="14" rx="2" fill="#f5f5f5"/>
      <text x="288" y="364" fill="#FCA600" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">RouterResult(classification or None)</text>

      <!-- Actor boxes -->
      <rect x="70" y="40" width="140" height="40" rx="6" fill="rgba(157,177,221,0.30)" stroke="#333A05" stroke-width="1"/>
      <text x="140" y="64" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Supervisor</text>

      <rect x="350" y="40" width="140" height="40" rx="6" fill="#ffffff" stroke="#333A05" stroke-width="1"/>
      <text x="420" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">RouterAgent</text>
      <text x="420" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">run_router</text>

      <rect x="610" y="40" width="140" height="40" rx="6" fill="#ffffff" stroke="#333A05" stroke-width="1"/>
      <text x="680" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">call_router</text>
      <text x="680" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">one LLM call attempt</text>

      <rect x="870" y="40" width="140" height="40" rx="6" fill="rgba(82,124,35,0.10)" stroke="#527C23" stroke-width="1"/>
      <text x="940" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Chat model</text>
      <text x="940" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">structured output</text>

      <!-- Legend -->
      <line x1="40" y1="576" x2="1060" y2="576" stroke="rgba(51,58,5,0.14)" stroke-width="0.8"/>
      <line x1="40" y1="596" x2="68" y2="596" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="76" y="600" fill="#333A05" font-size="11" font-family="Arial, sans-serif">Call</text>
      <line x1="140" y1="596" x2="168" y2="596" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="176" y="600" fill="#333A05" font-size="11" font-family="Arial, sans-serif">Return</text>
      <line x1="260" y1="596" x2="288" y2="596" stroke="#FCA600" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <text x="296" y="600" fill="#333A05" font-size="11" font-family="Arial, sans-serif">Result back to Supervisor</text>
    </svg>
