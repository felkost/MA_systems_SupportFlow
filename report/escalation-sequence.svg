<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1180 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="escalation-seq-title escalation-seq-desc">
      <title id="escalation-seq-title">Escalation's report-and-send sequence</title>
      <desc id="escalation-seq-desc">Sequence diagram showing the Supervisor's escalate_node calling run_escalation_agent, which asks the chat model to compose a report, masks PII in the result itself, then — unless bypass_hitl is set — blocks on a human operator's confirmation, hashes the customer's masked message to deduplicate against this session's already-escalated messages, writes the report to disk, and only if a second independent send flag and quota check pass, sends it to Telegram; the result returned to the Supervisor always reports whether the write and the send actually happened.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#000000"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FCA600"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="130" y1="80" x2="130" y2="600" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="380" y1="80" x2="380" y2="600" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="630" y1="80" x2="630" y2="600" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="870" y1="80" x2="870" y2="600" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="1080" y1="80" x2="1080" y2="600" stroke="rgba(51,58,5,0.25)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="126" y="112" width="8" height="458" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="376" y="112" width="8" height="458" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="626" y="144" width="8" height="52" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="866" y="248" width="8" height="52" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1076" y="398" width="8" height="120" fill="rgba(51,58,5,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1: Supervisor -> EscalationAgent -->
      <line x1="138" y1="112" x2="372" y2="112" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="170" y="98" width="220" height="14" rx="2" fill="#f5f5f5"/>
      <text x="280" y="108" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">run_escalation_agent(context)</text>

      <!-- M2: EscalationAgent -> ChatModel -->
      <line x1="388" y1="144" x2="622" y2="144" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="420" y="130" width="160" height="14" rx="2" fill="#f5f5f5"/>
      <text x="500" y="140" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">compose_fn(prompt)</text>

      <!-- M3: ChatModel --> EscalationAgent -->
      <line x1="630" y1="180" x2="392" y2="180" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="424" y="166" width="184" height="14" rx="2" fill="#f5f5f5"/>
      <text x="516" y="176" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">EscalationOutput</text>

      <!-- M4: self message mask_pii -->
      <path d="M 384,208 H 420 V 224 H 384" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="392" y="196" width="140" height="14" rx="2" fill="#f5f5f5"/>
      <text x="462" y="206" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">mask_pii(output)</text>

      <!-- OPT frame: HITL confirmation -->
      <rect x="364" y="248" width="522" height="88" rx="4" fill="rgba(51,58,5,0.03)" stroke="rgba(51,58,5,0.22)" stroke-width="1"/>
      <rect x="364" y="248" width="36" height="16" rx="2" fill="#f5f5f5" stroke="rgba(51,58,5,0.22)" stroke-width="1"/>
      <text x="382" y="260" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="0.08em">OPT</text>
      <text x="406" y="260" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">[not bypass_hitl]</text>

      <!-- M5: EscalationAgent -> Operator -->
      <line x1="388" y1="284" x2="862" y2="284" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="560" y="270" width="140" height="14" rx="2" fill="#f5f5f5"/>
      <text x="630" y="280" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">confirm_fn(output)</text>

      <!-- M6: Operator --> EscalationAgent -->
      <line x1="870" y1="316" x2="392" y2="316" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="590" y="302" width="80" height="14" rx="2" fill="#f5f5f5"/>
      <text x="630" y="312" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">y / N</text>

      <rect x="392" y="332" width="232" height="14" rx="2" fill="#f5f5f5"/>
      <text x="392" y="342" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">note: N → return here, no write/send</text>

      <!-- M6b: self message — dedup hash check -->
      <rect x="392" y="356" width="232" height="14" rx="2" fill="#f5f5f5"/>
      <text x="392" y="366" fill="#000000" font-size="11" font-family="Arial, sans-serif">sha256(masked_text) in seen_hashes?</text>
      <path d="M 384,376 H 420 V 392 H 384" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="392" y="400" width="320" height="14" rx="2" fill="#f5f5f5"/>
      <text x="392" y="410" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">note: seen before in session → return here (dedup)</text>

      <!-- M7: EscalationAgent -> Sinks (write) -->
      <line x1="388" y1="436" x2="1072" y2="436" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="680" y="422" width="180" height="14" rx="2" fill="#f5f5f5"/>
      <text x="770" y="432" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">write_fn(report)</text>

      <!-- OPT frame: real send -->
      <rect x="364" y="460" width="722" height="88" rx="4" fill="rgba(51,58,5,0.03)" stroke="rgba(51,58,5,0.22)" stroke-width="1"/>
      <rect x="364" y="460" width="36" height="16" rx="2" fill="#f5f5f5" stroke="rgba(51,58,5,0.22)" stroke-width="1"/>
      <text x="382" y="472" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="0.08em">OPT</text>
      <text x="406" y="472" fill="#4f5d75" font-size="11" font-family="Arial, sans-serif">[allow_real_send, channel set, quota not capped]</text>

      <!-- M8: EscalationAgent -> Sinks (send) -->
      <line x1="388" y1="504" x2="1072" y2="504" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="680" y="490" width="180" height="14" rx="2" fill="#f5f5f5"/>
      <text x="770" y="500" fill="#000000" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">send_fn(telegram text)</text>

      <!-- M9: EscalationAgent --> Supervisor (headline return, accent) -->
      <line x1="376" y1="580" x2="142" y2="580" stroke="#FCA600" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="150" y="566" width="220" height="14" rx="2" fill="#f5f5f5"/>
      <text x="260" y="576" fill="#FCA600" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">EscalationAgentResult(written, sent)</text>

      <!-- Actor boxes -->
      <rect x="60" y="40" width="140" height="40" rx="6" fill="rgba(157,177,221,0.30)" stroke="#333A05" stroke-width="1"/>
      <text x="130" y="64" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Supervisor</text>

      <rect x="310" y="40" width="140" height="40" rx="6" fill="#ffffff" stroke="#333A05" stroke-width="1"/>
      <text x="380" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">EscalationAgent</text>
      <text x="380" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">run_escalation_agent</text>

      <rect x="560" y="40" width="140" height="40" rx="6" fill="rgba(82,124,35,0.10)" stroke="#527C23" stroke-width="1"/>
      <text x="630" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Chat model</text>
      <text x="630" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">openai/gpt-5.6-luna</text>

      <rect x="800" y="40" width="140" height="40" rx="6" fill="rgba(157,177,221,0.30)" stroke="#333A05" stroke-width="1"/>
      <text x="870" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Operator</text>
      <text x="870" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">human, CLI stdin</text>

      <rect x="1010" y="40" width="140" height="40" rx="6" fill="rgba(82,124,35,0.10)" stroke="#527C23" stroke-width="1"/>
      <text x="1080" y="58" fill="#333A05" font-size="12" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">Sinks</text>
      <text x="1080" y="72" fill="#333A05" font-size="11" font-family="Arial, sans-serif" text-anchor="middle">report file + Telegram</text>

      <!-- Legend -->
      <line x1="40" y1="616" x2="1140" y2="616" stroke="rgba(51,58,5,0.14)" stroke-width="0.8"/>
      <line x1="40" y1="636" x2="68" y2="636" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="76" y="640" fill="#333A05" font-size="11" font-family="Arial, sans-serif">Call</text>
      <line x1="140" y1="636" x2="168" y2="636" stroke="#000000" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="176" y="640" fill="#333A05" font-size="11" font-family="Arial, sans-serif">Return</text>
      <line x1="260" y1="636" x2="288" y2="636" stroke="#FCA600" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <text x="296" y="640" fill="#333A05" font-size="11" font-family="Arial, sans-serif">Result back to Supervisor</text>
    </svg>
