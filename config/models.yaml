# Per-agent OpenRouter model, temperature, max tokens, timeout, and
# confidence threshold. The model-scout agent (agentic-model-
# selection) resolved these against a live OpenRouter catalogue query on
# 2026-08-25, per-role candidates, stack costs, and the judge-family-
# independence check. Re-run model-scout and refresh the price data
# before trusting these prices again; do not carry them forward from
# memory.

router:
  model: "google/gemini-3.5-flash-lite"
  temperature: 0
  max_tokens: 256
  timeout_seconds: 10
  confidence_threshold: null # Router has no confidence output — no tools.

docs:
  model: "openai/gpt-5.6-luna"
  temperature: 0
  max_tokens: 1024
  # Raised 30 -> 75 on measurement, 2026-08-26, not on a guess: real
  # end-to-end times observed through `/chat` were
  # 12.5s warm but 38.1s and 40.6s on the paths that then escalated —
  # i.e. the agent was still working correctly and the supervisor gave up
  # on it. The 30s value dated from before Silpo MCP's branch/delivery/
  # timeslot bootstrap chain (4 tool calls on a cold cache) was on the
  # critical path. 75s covers the observed cold path with headroom while
  # still bounding a genuinely hung call.
  timeout_seconds: 75
  confidence_threshold: 0.70 # orientation value — re-set after
    # the first full golden-dataset run, not before.
  port: 8801 # this agent runs as its own A2A server process, unlike
    # router/escalation/supervisor.
  retriever_k: 4 # each of the hybrid retriever's two sub-retrievers
    # (Chroma, BM25) returns this many chunks before they're merged.
    # Unreviewed default carried over from the retriever's own original
    # implementation — moved here so it is at least visible and
    # reviewable; lowering it needs a measured golden-dataset re-run
    # (docs/decisions.md), not a guess.

web_search:
  model: "deepseek/deepseek-v4-flash"
  temperature: 0
  # Raised 1024 -> 2048 on measurement, 2026-08-29, not on a guess: live
  # `/chat` requests on the web_search route were failing with
  # `Could not parse response content as the length limit was reached -
  # CompletionUsage(completion_tokens=1024, ...)` — the model was being
  # cut off mid-JSON while composing an answer plus its source list, and
  # the unparseable result surfaced to the customer as "the search tool
  # is unavailable", which it was not. This *saves* tokens rather than
  # spending them: a truncated call burns its full 1024-token completion
  # producing nothing, then costs a second paid call when the request
  # escalates. max_tokens is a ceiling, not a spend — a short answer
  # still costs what it costs.
  max_tokens: 2048
  # Same measured basis as `docs` above — a real search + compose round
  # trip was seen at 38.1s through the live UI, over the old 30s bound.
  timeout_seconds: 75
  confidence_threshold: 0.70
  port: 8802 # separate A2A server process.

escalation:
  model: "openai/gpt-5.6-luna"
  temperature: 0.2
  max_tokens: 512
  timeout_seconds: 15
  confidence_threshold: null

judge:
  # Different family from every agent role above (Google/OpenAI/DeepSeek) —
  # keeps the judge independent of every model it grades. Anthropic,
  # confirmed structured_outputs support in the 2026-08-25 catalogue query.
  model: "anthropic/claude-haiku-4.5"
  # Pinned harder than the agents it grades: a judge's own score must be
  # reproducible on the same answer, or a moved number cannot be
  # attributed to the answer changing versus the judge re-rolling.
  # Confirmed against the installed DeepEval source: `temperature=None`
  # already resolves to 0.0 via `OpenRouterModel`'s own default, so this
  # states the current effective value rather than changing it — no
  # re-baselining needed. This only reaches DeepEval's offline judge; the
  # live Langfuse judge has no temperature slot in its evaluator API at
  # all (`EvaluatorModelConfig` accepts only `provider`/`model`) and
  # cannot be pinned from here.
  temperature: 0
