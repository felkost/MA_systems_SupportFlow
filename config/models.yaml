# Per-agent OpenRouter model, temperature, max tokens, timeout, and
# confidence threshold (task §8). The model-scout agent (agentic-model-
# selection) resolved these against a live OpenRouter catalogue query on
# 2026-08-25 — see docs/model-prices-2026-08-25-02.md for per-role
# candidates, stack costs, and the judge-family-independence check.
# Re-run model-scout and refresh that file before trusting these prices
# again; do not carry them forward from memory.

router:
  model: "google/gemini-3.5-flash-lite"
  temperature: 0
  max_tokens: 256
  timeout_seconds: 10
  confidence_threshold: null # Router has no confidence output — no tools.

docs:
  model: "openai/gpt-5.6-luna"
  temperature: 0
  max_tokens: 1024
  timeout_seconds: 30
  confidence_threshold: 0.70 # orientation value, task §10 — re-set after
    # the first full golden-dataset run, not before.

web_search:
  model: "deepseek/deepseek-v4-flash"
  temperature: 0
  max_tokens: 1024
  timeout_seconds: 30
  confidence_threshold: 0.70

escalation:
  model: "openai/gpt-5.6-luna"
  temperature: 0.2
  max_tokens: 512
  timeout_seconds: 15
  confidence_threshold: null

supervisor:
  model: "google/gemini-3.5-flash-lite"
  temperature: 0
  max_tokens: 512
  timeout_seconds: 10
  confidence_threshold: null

judge:
  # Different family from every agent role above (Google/OpenAI/DeepSeek) —
  # see CLAUDE.md invariant on judge-family independence. Anthropic,
  # confirmed structured_outputs support in the 2026-08-25 catalogue query.
  model: "anthropic/claude-haiku-4.5"
