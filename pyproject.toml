[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = '(^\.venv/|^\.cache/|^docs/)'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: fast sanity check, runs on every commit",
    "eval: slower, runs against live services or the golden dataset",
]
