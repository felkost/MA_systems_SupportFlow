[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = '(^\.venv/|^\.cache/|^docs/)'

# Third-party packages this project does not control the type stubs of.
# Not a project invariant — narrowed to exactly the modules that need it,
# never a blanket ignore.
[[tool.mypy.overrides]]
module = ["yaml", "langfuse.*", "langgraph.*", "langchain_openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `eval`-marked tests make real LLM/Silpo MCP/Tavily/
# Telegram calls (the golden-dataset run) — excluded by default so plain
# `pytest --cov=src` keeps the README's Gate promise ("never makes a live
# call"). Run them deliberately with `pytest -m eval tests/test_golden_dataset.py`
# or `deepeval test run tests/test_golden_dataset.py -m eval`.
addopts = "-m 'not eval'"
markers = [
    "smoke: fast sanity check, runs on every commit",
    "eval: slower, runs against live services or the golden dataset",
]
